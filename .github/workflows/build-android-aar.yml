name: Build Android AAR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sdk-android/**'
      - '.github/workflows/build-android-aar.yml'

permissions:
  contents: write

concurrency:
  group: publish-android-aar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release AAR
        working-directory: sdk-android
        run: |
          chmod +x ./gradlew
          ./gradlew :monetize-sdk:assembleRelease

      - name: Stage generated AAR safely
        shell: bash
        run: |
          cp sdk-android/monetize-sdk/build/outputs/aar/monetize-sdk-release.aar /tmp/PocketsFullMonetize-1.0.0.aar
          git fetch origin main
          git reset --hard origin/main
          mkdir -p dist/android
          cp /tmp/PocketsFullMonetize-1.0.0.aar dist/android/PocketsFullMonetize-1.0.0.aar

      - name: Commit generated AAR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/android/PocketsFullMonetize-1.0.0.aar
          if git diff --cached --quiet; then
            echo "Android AAR is already current."
            exit 0
          fi
          git commit -m "Build Android v1.0.0 AAR"
          git push origin HEAD:main

# Builds the public distribution AAR from the checked-in v1.0.0 source.
